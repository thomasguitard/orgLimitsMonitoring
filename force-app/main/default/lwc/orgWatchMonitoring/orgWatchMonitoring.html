<template>
    <!-- Utilisateur sans aucun des deux Permission Sets OrgWatch : aucun
         onglet ne doit être rendu, seulement l'explication de la marche à
         suivre. Le garde-fou serveur (assertOrgWatchAccess) reste la vraie
         barrière ; ceci évite d'afficher une coquille vide d'onglets. -->
    <template if:true={showAccessDenied}>
        <div class="app-shell">
            <lightning-card>
                <div class="slds-p-around_large slds-text-align_center">
                    <lightning-icon icon-name="utility:lock" size="small" variant="warning" class="slds-m-bottom_small"></lightning-icon>
                    <h2 class="slds-text-heading_small slds-m-bottom_x-small">{labels.accessDeniedTitle}</h2>
                    <p class="ow-error-text">{labels.accessDeniedMessage}</p>
                </div>
            </lightning-card>
        </div>
    </template>

    <template if:true={hasOrgWatchAccess}>
    <div class="app-shell">
    <lightning-card>
        <div class="app-navbar">
            <span class="brand-logo-badge">
                <img src={logoUrl} alt={labels.cardTitle} class="brand-logo" />
                <span class="brand-logo-text">{labels.cardTitle}</span>
            </span>

            <nav class="tab-nav">
                <button type="button" class={monitoringTabClass} data-tab="monitoring" onclick={handleTabChange}>
                    <lightning-icon icon-name="utility:chart" size="xx-small" class="tab-nav-icon"></lightning-icon>
                    <span>{labels.tabMonitoring}</span>
                </button>
                <button type="button" class={alertsTabClass} data-tab="alerts" onclick={handleTabChange}>
                    <lightning-icon icon-name="utility:notification" size="xx-small" class="tab-nav-icon"></lightning-icon>
                    <span>{labels.tabAlerts}</span>
                </button>
                <!-- Onglets réservés au Permission Set "OrgWatch - Admin",
                     regroupés en fin de barre : les deux premiers onglets sont
                     ainsi les mêmes pour tout le monde, et l'interface d'un
                     non-admin n'est plus l'interface admin avec des trous. -->
                <template if:true={isAdminUser}>
                    <button type="button" class={scheduleTabClass} data-tab="schedule" onclick={handleTabChange}>
                        <lightning-icon icon-name="utility:clock" size="xx-small" class="tab-nav-icon"></lightning-icon>
                        <span>{labels.tabSchedule}</span>
                    </button>
                    <button type="button" class={purgeTabClass} data-tab="purge" onclick={handleTabChange}>
                        <lightning-icon icon-name="utility:delete" size="xx-small" class="tab-nav-icon"></lightning-icon>
                        <span>{labels.tabPurge}</span>
                    </button>
                    <button type="button" class={adminTabClass} data-tab="admin" onclick={handleTabChange}>
                        <lightning-icon icon-name="utility:einstein" size="xx-small" class="tab-nav-icon"></lightning-icon>
                        <span>{labels.tabAdmin}</span>
                    </button>
                </template>
            </nav>

            <div class="header-controls">
                <div class="lang-switch">
                    <button type="button" class={frButtonClass} onclick={setLanguageFr}>FR</button>
                    <button type="button" class={enButtonClass} onclick={setLanguageEn}>EN</button>
                </div>
                <button type="button" class="icon-toggle-btn" onclick={toggleDarkMode} aria-label={darkModeAlt} title={darkModeAlt}>
                    <template if:false={isDarkMode}>
                        <svg viewBox="0 0 24 24" class="theme-icon" aria-hidden="true">
                            <circle cx="12" cy="12" r="4.5"></circle>
                            <g stroke-linecap="round">
                                <line x1="12" y1="1.5" x2="12" y2="4"></line>
                                <line x1="12" y1="20" x2="12" y2="22.5"></line>
                                <line x1="1.5" y1="12" x2="4" y2="12"></line>
                                <line x1="20" y1="12" x2="22.5" y2="12"></line>
                                <line x1="4.6" y1="4.6" x2="6.3" y2="6.3"></line>
                                <line x1="17.7" y1="17.7" x2="19.4" y2="19.4"></line>
                                <line x1="4.6" y1="19.4" x2="6.3" y2="17.7"></line>
                                <line x1="17.7" y1="6.3" x2="19.4" y2="4.6"></line>
                            </g>
                        </svg>
                    </template>
                    <template if:true={isDarkMode}>
                        <svg viewBox="0 0 24 24" class="theme-icon" aria-hidden="true">
                            <path d="M20.6 15.4a9 9 0 1 1-12-12 7.2 7.2 0 0 0 12 12z"></path>
                        </svg>
                    </template>
                </button>
                <button type="button" class="icon-toggle-btn" onclick={openSettings} aria-label={labels.settingsAlt} title={labels.settingsAlt}>
                    <svg viewBox="0 0 24 24" class="theme-icon" aria-hidden="true">
                        <path fill-rule="evenodd" d="M19.14,12.94c0.04,-0.3 0.06,-0.61 0.06,-0.94c0,-0.32 -0.02,-0.64 -0.07,-0.94l2.03,-1.58c0.18,-0.14 0.23,-0.41 0.12,-0.61l-1.92,-3.32c-0.12,-0.22 -0.37,-0.29 -0.59,-0.22l-2.39,0.96c-0.5,-0.38 -1.03,-0.7 -1.62,-0.94L14.4,2.81c-0.04,-0.24 -0.24,-0.41 -0.48,-0.41h-3.84c-0.24,0 -0.43,0.17 -0.47,0.41L9.25,5.35C8.66,5.59 8.12,5.92 7.63,6.29L5.24,5.33c-0.22,-0.08 -0.47,0 -0.59,0.22L2.74,8.87C2.62,9.08 2.66,9.34 2.86,9.48l2.03,1.58C4.84,11.36 4.8,11.69 4.8,12s0.02,0.64 0.07,0.94l-2.03,1.58c-0.18,0.14 -0.23,0.41 -0.12,0.61l1.92,3.32c0.12,0.22 0.37,0.29 0.59,0.22l2.39,-0.96c0.5,0.38 1.03,0.7 1.62,0.94l0.36,2.54c0.05,0.24 0.24,0.41 0.48,0.41h3.84c0.24,0 0.44,-0.17 0.47,-0.41l0.36,-2.54c0.59,-0.24 1.13,-0.56 1.62,-0.94l2.39,0.96c0.22,0.08 0.47,0 0.59,-0.22l1.92,-3.32c0.12,-0.22 0.07,-0.47 -0.12,-0.61L19.14,12.94zM12,15.6c-1.98,0 -3.6,-1.62 -3.6,-3.6s1.62,-3.6 3.6,-3.6s3.6,1.62 3.6,3.6S13.98,15.6 12,15.6z"></path>
                    </svg>
                </button>
            </div>
        </div>

            <div class={monitoringTabWrapperClass}>
                    <template if:true={showInitialSpinner}>
                        <div class="loading-screen">
                            <lightning-spinner alternative-text={labels.monitoringSpinner} size="large"></lightning-spinner>
                        </div>
                    </template>
                <div class="slds-grid main-container">
                    <div class={leftPanelClass}>
                        <div class="slds-p-around_medium">
                            <div class="ow-field-label">{labels.selectMetric}</div>
                            <lightning-combobox
                                name="limitSelector"
                                variant="label-hidden"
                                label={labels.selectMetric}
                                value={selectedLimit}
                                options={limitOptions}
                                onchange={handleLimitChange}>
                            </lightning-combobox>

                            <div class="slds-m-top_medium slds-box slds-box_x-small chart-container">
                                <canvas class="linechart" lwc:dom="manual" width="800" height="380"></canvas>
                            </div>

                            <template if:true={error}>
                                <p class="ow-error-text slds-m-top_small">{error}</p>
                            </template>
                        </div>
                    </div>

                    <template if:true={hasSnapshot}>
                        <div class="slds-col slds-size_5-of-12 snapshot-panel">
                            <div class="slds-p-around_small">
                                <div class="slds-grid slds-grid_align-spread slds-m-bottom_small">
                                    <div>
                                        <h2 class="slds-text-heading_small">{labels.snapshotTitle}</h2>
                                        <p class="slds-text-body_small slds-text-color_weak">{selectedSnapshot.formattedDate}</p>
                                    </div>
                                    <lightning-button-icon
                                        icon-name="utility:close"
                                        alternative-text={labels.closeAlt}
                                        variant="bare"
                                        onclick={closeSnapshot}>
                                    </lightning-button-icon>
                                </div>

                                <div class="snapshot-content">
                                    <template for:each={snapshotMetrics} for:item="metric">
                                        <div key={metric.name}
                                             class={metric.rowClass}
                                             title={metric.rowTitle}
                                             data-metric={metric.name}
                                             role="button"
                                             tabindex="0"
                                             onclick={handleSnapshotMetricClick}
                                             onkeydown={handleSnapshotMetricKeydown}>
                                            <div class="slds-grid slds-grid_align-spread slds-m-bottom_xxx-small">
                                                <div class="slds-grid slds-grid_vertical-align-center">
                                                    <span class="metric-name slds-truncate slds-m-right_xx-small" title={metric.friendlyName}>
                                                        {metric.friendlyName}
                                                    </span>
                                                    <lightning-helptext
                                                        content={metric.description}
                                                        icon-variant="bare"
                                                        class="metric-tooltip">
                                                    </lightning-helptext>
                                                </div>
                                                <span class={metric.statusClass}>{metric.percentage}%</span>
                                            </div>

                                            <div class="progress-bar-compact">
                                                <div class={metric.statusClass} style={metric.progressStyle}></div>
                                            </div>

                                            <div class="slds-grid slds-grid_align-spread metric-values">
                                                <span>{metric.currentDisplay}</span>
                                                <span class="slds-text-color_weak">/ {metric.maxDisplay}</span>
                                            </div>
                                        </div>
                                    </template>
                                </div>
                            </div>
                        </div>
                    </template>
                </div>
                </div>

            <template if:true={isScheduleTabActive}>
                <div class="slds-p-around_medium">

                    <div class="schedule-section">
                        <div class="slds-grid slds-grid_align-spread slds-m-bottom_medium">
                            <h2 class="slds-text-heading_medium">{labels.activeSchedulesTitle}</h2>
                                <lightning-button
                                    label={labels.refresh}
                                    icon-name="utility:refresh"
                                    class="refresh-button"
                                    onclick={refreshSchedules}>
                                </lightning-button>
                        </div>

                        <template if:true={loadingSchedules}>
                            <lightning-spinner alternative-text={labels.loading} size="small"></lightning-spinner>
                        </template>

                        <template if:false={loadingSchedules}>
                            <template if:true={hasActiveSchedules}>
                                <div class="slds-box slds-theme_shade">
                                    <table class="slds-table slds-table_cell-buffer slds-table_bordered">
                                        <thead>
                                            <tr class="slds-line-height_reset">
                                                <th scope="col"><div class="slds-truncate">{labels.colJobName}</div></th>
                                                <th scope="col"><div class="slds-truncate">{labels.colFrequency}</div></th>
                                                <th scope="col"><div class="slds-truncate">{labels.colNextRun}</div></th>
                                                <th scope="col"><div class="slds-truncate">{labels.colStatus}</div></th>
                                                <th scope="col"><div class="slds-truncate">{labels.colActions}</div></th>
                                            </tr>
                                        </thead>
                                        <tbody>
                                            <template for:each={activeSchedules} for:item="schedule">
                                                <tr key={schedule.jobId} class="slds-hint-parent">
                                                    <td><div class="slds-truncate">{schedule.jobName}</div></td>
                                                    <td><div class="slds-truncate">{schedule.frequency}</div></td>
                                                    <td><div class="slds-truncate">{schedule.nextRun}</div></td>
                                                    <td>
                                                        <lightning-badge label={schedule.state} variant={schedule.badgeVariant}></lightning-badge>
                                                    </td>
                                                    <td>
                                                        <lightning-button-icon
                                                            icon-name="utility:delete"
                                                            alternative-text={labels.deleteAlt}
                                                            variant="border-filled"
                                                            data-job-id={schedule.jobId}
                                                            onclick={deleteSchedule}>
                                                        </lightning-button-icon>
                                                    </td>
                                                </tr>
                                            </template>
                                        </tbody>
                                    </table>
                                </div>
                            </template>

                            <template if:false={hasActiveSchedules}>
                                <div class="slds-box slds-text-align_center slds-p-around_medium empty-state">
                                    <lightning-icon icon-name="utility:clock" size="large" class="slds-m-bottom_small"></lightning-icon>
                                    <p class="slds-text-heading_small">{labels.noActiveSchedule}</p>
                                    <p class="slds-text-color_weak">{labels.configureBelowHint}</p>
                                </div>
                            </template>
                        </template>
                    </div>

                    <div class="schedule-section slds-m-top_large">
                        <h2 class="slds-text-heading_medium slds-m-bottom_medium">
                            <lightning-icon icon-name="utility:add" size="small" class="slds-m-right_x-small section-icon"></lightning-icon>
                            {labels.newScheduleTitle}
                        </h2>

                        <template if:true={hasActiveSchedules}>
                            <div class="slds-box slds-theme_warning slds-m-bottom_medium">
                                <div class="slds-grid slds-grid_vertical-align-center">
                                    <lightning-icon icon-name="utility:warning" size="small" variant="warning" class="slds-m-right_small"></lightning-icon>
                                    <div>
                                        <p class="slds-text-heading_small">{labels.attentionTitle}</p>
                                        <p>{labels.disableExistingHint}</p>
                                    </div>
                                </div>
                            </div>
                        </template>

                        <fieldset class="slds-box slds-p-around_medium" disabled={hasActiveSchedules}>
                            <legend class="slds-text-heading_small slds-m-bottom_small">{labels.exportFrequencyLegend}</legend>

                            <div class="ow-field-label">{labels.chooseFrequency}</div>
                            <div class="ow-btn-group">
                                <button type="button" class={freq15minClass} data-value="15min" onclick={handleFrequencyChange}>{labels.freq15min}</button>
                                <button type="button" class={freq30minClass} data-value="30min" onclick={handleFrequencyChange}>{labels.freq30min}</button>
                                <button type="button" class={freqHourlyClass} data-value="hourly" onclick={handleFrequencyChange}>{labels.freqHourly}</button>
                                <button type="button" class={freqDailyClass} data-value="daily" onclick={handleFrequencyChange}>{labels.freqDaily}</button>
                            </div>

                            <template if:true={showTimeSelector}>
                                <div class="slds-m-top_medium">
                                    <div class="ow-field-label">{timeSelectorLabel}</div>
                                    <lightning-combobox
                                        name="timeSelector"
                                        variant="label-hidden"
                                        label={timeSelectorLabel}
                                        value={selectedTime}
                                        options={timeOptions}
                                        placeholder={labels.selectTimePlaceholder}
                                        onchange={handleTimeChange}
                                        required>
                                    </lightning-combobox>
                                </div>
                            </template>

                            <template if:true={scheduleSummary}>
                                <div class="slds-box slds-theme_info slds-m-top_medium">
                                    <p class="slds-text-heading_small slds-m-bottom_x-small">
                                        <lightning-icon icon-name="utility:info" size="xx-small" class="slds-m-right_x-small"></lightning-icon>
                                        {labels.scheduleSummaryTitle}
                                    </p>
                                    <p>{scheduleSummary}</p>
                                </div>
                            </template>

                            <div class="slds-m-top_medium">
                                <lightning-button
                                    label={labels.activateSchedule}
                                    variant="brand"
                                    icon-name="utility:check"
                                    onclick={createSchedule}
                                    disabled={isScheduleButtonDisabled}>
                                </lightning-button>
                            </div>
                        </fieldset>
                    </div>

                </div>
            </template>

            <template if:true={isPurgeTabActive}>
                <div class="slds-p-around_medium">

                    <div class="slds-grid slds-gutters slds-wrap purge-stats-row">
                        <div class="slds-col slds-size_1-of-3">
                            <div class="stat-card">
                                <lightning-icon icon-name="utility:file" size="small" class="slds-m-bottom_x-small"></lightning-icon>
                                <p class="stat-value">{totalFileCount}</p>
                                <p class="stat-label">{labels.statFilesPresent}</p>
                            </div>
                        </div>
                        <div class="slds-col slds-size_1-of-3">
                            <div class="stat-card stat-teal">
                                <lightning-icon icon-name="utility:storage" size="small" class="slds-m-bottom_x-small"></lightning-icon>
                                <p class="stat-value">{totalSizeFormatted}</p>
                                <p class="stat-label">{labels.statTotalSize}</p>
                            </div>
                        </div>
                        <div class="slds-col slds-size_1-of-3">
                            <div class="stat-card stat-amber">
                                <lightning-icon icon-name="utility:date_time" size="small" class="slds-m-bottom_x-small"></lightning-icon>
                                <p class="stat-value">{oldestFileDateFormatted}</p>
                                <p class="stat-label">{labels.statOldestFile}</p>
                            </div>
                        </div>
                    </div>

                    <template if:true={loadingDataFiles}>
                        <lightning-spinner alternative-text={labels.loading} size="small"></lightning-spinner>
                    </template>

                    <template if:true={dataFilesError}>
                        <p class="ow-error-text slds-m-top_small">{dataFilesError}</p>
                    </template>

                    <div class="slds-box slds-m-top_large purge-schedule-section">
                        <h2 class="slds-text-heading_medium slds-m-bottom_small">
                            <lightning-icon icon-name="utility:clock" size="small" class="slds-m-right_x-small section-icon icon-teal"></lightning-icon>
                            {labels.purgeAutoTitle}
                        </h2>

                        <template if:true={loadingPurgeSchedule}>
                            <lightning-spinner alternative-text={labels.loading} size="small"></lightning-spinner>
                        </template>

                        <template if:false={loadingPurgeSchedule}>
                            <template if:true={hasActivePurgeSchedule}>
                                <div class="slds-grid slds-grid_align-spread slds-grid_vertical-align-start">
                                    <div>
                                        <p>
                                            {labels.purgeAutoActivePrefix}<strong>{labels.purgeAutoDaily}</strong>{labels.purgeAutoActiveMid}<strong>{activePurgeSchedule.timeValue}</strong>{labels.purgeAutoActiveSuffix}<strong>{activePurgeSchedule.ageDays}</strong>{labels.purgeAutoDaysSuffix}
                                        </p>
                                        <p class="slds-text-body_small slds-text-color_weak">
                                            {labels.nextRunLabel}{activePurgeSchedule.nextRunFormatted}
                                        </p>
                                        <template if:true={activePurgeSchedule.lastRunDate}>
                                            <template if:false={activePurgeSchedule.lastRunFailed}>
                                                <p class="slds-text-body_small slds-text-color_success slds-m-top_xx-small">
                                                    <lightning-icon icon-name="utility:success" size="xx-small" variant="success" class="slds-m-right_xx-small"></lightning-icon>
                                                    {labels.lastRunSuccessPrefix}{activePurgeSchedule.lastRunFormatted}
                                                </p>
                                            </template>
                                            <template if:true={activePurgeSchedule.lastRunFailed}>
                                                <div class="slds-box slds-theme_error slds-m-top_x-small">
                                                    <p>
                                                        <lightning-icon icon-name="utility:error" size="xx-small" variant="inverse" class="slds-m-right_xx-small"></lightning-icon>
                                                        {labels.lastRunFailedPrefix}{activePurgeSchedule.lastRunFormatted}{labels.lastRunFailedMid}{activePurgeSchedule.lastRunError}
                                                    </p>
                                                </div>
                                            </template>
                                        </template>
                                    </div>
                                    <lightning-button-icon
                                        icon-name="utility:delete"
                                        alternative-text={labels.disableAutoPurgeAlt}
                                        variant="border-filled"
                                        onclick={deletePurgeSchedule}>
                                    </lightning-button-icon>
                                </div>
                            </template>

                            <template if:false={hasActivePurgeSchedule}>
                                <div class="slds-grid slds-grid_vertical-align-end slds-gutters slds-wrap">
                                    <div class="slds-col slds-size_1-of-3">
                                        <div class="ow-field-label">{labels.deleteOlderThanLabel}</div>
                                        <lightning-input
                                            type="number"
                                            variant="label-hidden"
                                            label={labels.deleteOlderThanLabel}
                                            value={scheduledPurgeAgeDays}
                                            min="1"
                                            onchange={handleScheduledPurgeAgeChange}>
                                        </lightning-input>
                                    </div>
                                    <div class="slds-col slds-size_1-of-3">
                                        <div class="ow-field-label">{timeSelectorLabel}</div>
                                        <lightning-combobox
                                            name="purgeTimeSelector"
                                            variant="label-hidden"
                                            label={timeSelectorLabel}
                                            value={scheduledPurgeTime}
                                            options={timeOptions}
                                            placeholder={labels.selectTimePlaceholder}
                                            onchange={handleScheduledPurgeTimeChange}>
                                        </lightning-combobox>
                                    </div>
                                    <div class="slds-col">
                                        <lightning-button
                                            label={labels.activateAutoPurge}
                                            variant="brand"
                                            icon-name="utility:check"
                                            onclick={openCreatePurgeScheduleConfirm}
                                            disabled={isCreatePurgeScheduleDisabled}>
                                        </lightning-button>
                                    </div>
                                </div>
                            </template>
                        </template>
                    </div>

                    <template if:true={hasDataFiles}>
                        <div class="slds-box slds-m-top_large purge-section">
                            <h2 class="slds-text-heading_medium slds-m-bottom_small">
                                <lightning-icon icon-name="utility:delete" size="small" class="slds-m-right_x-small section-icon icon-amber"></lightning-icon>
                                {labels.manualPurgeTitle}
                            </h2>
                            <p class="slds-text-color_weak slds-m-bottom_medium">
                                {labels.manualPurgeHint}
                            </p>

                            <div class="ow-field-label">{sliderLabel}</div>
                            <input
                                type="range"
                                class="ow-slider"
                                min="0"
                                max={maxAgeDays}
                                step="1"
                                value={purgeAgeDays}
                                aria-label={sliderLabel}
                                oninput={handleAgeSliderChange} />
                            <div class="ow-slider-range">
                                <span>0</span>
                                <span>{maxAgeDays}</span>
                            </div>

                            <div class="slds-grid slds-m-top_x-small purge-presets">
                                <template for:each={agePresets} for:item="preset">
                                    <lightning-button
                                        key={preset.value}
                                        label={preset.label}
                                        variant="neutral"
                                        size="small"
                                        class="slds-m-right_xx-small"
                                        data-value={preset.value}
                                        onclick={handlePresetClick}>
                                    </lightning-button>
                                </template>
                            </div>

                            <div class="slds-box slds-theme_shade slds-m-top_medium purge-preview">
                                <p class="slds-text-heading_small slds-m-bottom_x-small">
                                    {labels.filesOlderThan}{cutoffDateFormatted}
                                </p>

                                <div class="purge-bar">
                                    <div class="purge-bar-kept" style={keptBarStyle}></div>
                                    <div class="purge-bar-purge" style={purgeBarStyle}></div>
                                </div>

                                <div class="slds-grid slds-grid_align-spread slds-m-top_x-small purge-legend">
                                    <span class="legend-kept">
                                        <span class="legend-dot"></span>
                                        {filesToKeepCount}{labels.keptLegend}{sizeToKeepFormatted}
                                    </span>
                                    <span class="legend-purge">
                                        <span class="legend-dot"></span>
                                        {filesToPurgeCount}{labels.purgeLegend}{sizeToPurgeFormatted}
                                    </span>
                                </div>
                            </div>

                            <div class="slds-m-top_medium">
                                <lightning-button
                                    label={labels.purgeSelected}
                                    variant="destructive"
                                    icon-name="utility:delete"
                                    onclick={openPurgeConfirm}
                                    disabled={isPurgeButtonDisabled}>
                                </lightning-button>
                            </div>
                        </div>
                    </template>

                    <template if:false={hasDataFiles}>
